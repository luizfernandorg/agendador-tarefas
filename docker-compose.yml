version: '3.8'

services:
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://db:27017/db_agendador
    depends_on:
      - db

  db:
    image: mongodb/mongodb-community-server
    environment:
      MONGO_INITDB_DATABASE: db_agendador
    ports:
      - "27017:27017"